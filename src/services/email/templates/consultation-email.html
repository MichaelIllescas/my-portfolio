<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>Nuevo mensaje - {{APP_NAME}}</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f3f4f6;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f3f4f6" style="background-color: #f3f4f6;">
        <tr>
            <td align="center" style="padding: 32px 16px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="max-width: 560px; background-color: #ffffff; border: 1px solid #e5e7eb; font-family: Arial, Helvetica, sans-serif;">
                    <tr>
                        <td style="padding: 32px 32px 24px 32px; border-bottom: 1px solid #e5e7eb;">
                            <p style="margin: 0 0 6px 0; font-size: 20px; line-height: 26px; font-weight: bold; color: #111827;">Nuevo mensaje desde el portfolio</p>
                            <p style="margin: 0; font-size: 13px; line-height: 20px; color: #6b7280;">{{CURRENT_DATE}}</p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 24px 32px 0 32px;">
                            <p style="margin: 0 0 2px 0; font-size: 13px; line-height: 20px; color: #6b7280;">Nombre</p>
                            <p style="margin: 0 0 16px 0; font-size: 16px; line-height: 24px; color: #111827;">{{FIRST_NAME}} {{LAST_NAME}}</p>
                            <p style="margin: 0 0 2px 0; font-size: 13px; line-height: 20px; color: #6b7280;">Email</p>
                            <p style="margin: 0 0 16px 0; font-size: 16px; line-height: 24px;"><a href="mailto:{{EMAIL}}" style="color: #0f766e; text-decoration: underline;">{{EMAIL}}</a></p>
                            {{PHONE_SECTION}}
                            <p style="margin: 0 0 2px 0; font-size: 13px; line-height: 20px; color: #6b7280;">Mensaje</p>
                            <p style="margin: 0; font-size: 16px; line-height: 24px; color: #111827;">{{MESSAGE}}</p>
                            {{ADDITIONAL_SECTION}}
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 28px 32px 32px 32px;">
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td bgcolor="#0f766e" style="background-color: #0f766e;">
                                        <a href="mailto:{{EMAIL}}" style="display: inline-block; padding: 11px 22px; font-size: 15px; line-height: 20px; font-weight: bold; color: #ffffff; text-decoration: none;">Responder</a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
